name: CI

# Verifies every pull request into main before it can be merged.
# No AWS credentials, no deploy — just typecheck, build, and CDK synth.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck (backend, frontend, infra)
        run: npm run typecheck
      - name: Build frontend
        run: npm run build:frontend
      - name: CDK synth (bundles all Lambdas)
        working-directory: infra
        run: npx cdk synth --quiet
